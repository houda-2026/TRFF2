<style>
/* ===== DESIGN SYSTEM (écrit une seule fois) ===== */
:root{
  --bg:#000000; --card:#050505; --txt:#E0AE28; --main:#FFFFFF; --acc:#E0AE28; --grenat:#A3263B;
  --ok:#4CC38A; --warn:#F5963A; --bad:#FF6B6B; --none:#B8B8B8;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
  --r1:12px; --r2:24px; --r3:999px;
  --edge:rgba(255,255,255,.10); --shine:rgba(255,255,255,.06);
  --shadow:0 16px 48px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
  --f-title:'Cinzel',Georgia,serif; --f-body:'Inter',system-ui,sans-serif;
  --t-title:40px; --t-sub:24px; --t-big:clamp(56px,7vw,104px); --t-text:16px; --t-cap:13px;
  --rail:72px; --side:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--txt);font:300 var(--t-text)/1.55 var(--f-body);min-height:100vh;overflow-x:hidden}
h1{font:400 var(--t-title)/1.15 var(--f-title);color:var(--main);letter-spacing:.02em;overflow-wrap:anywhere}
h2{font:400 var(--t-sub)/1.25 var(--f-title);color:var(--main);overflow-wrap:anywhere}
h3{font:400 18px/1.3 var(--f-title);color:var(--main)}
a{color:var(--acc)} p{max-width:75ch}
.cap{font-size:var(--t-cap);color:var(--txt);opacity:.85}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.num{font-family:var(--f-title);font-weight:400;font-variant-numeric:tabular-nums;color:var(--main)}
.num .u,.u{color:var(--acc)}
/* fond noir « liquid » */
#bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 20% 20%,#1b1b1b 0%,transparent 60%),
  radial-gradient(50% 60% at 80% 70%,#151515 0%,transparent 60%),
  radial-gradient(40% 40% at 60% 10%,#101010 0%,transparent 60%),#000;
  background-size:160% 160%;animation:liquid 26s ease-in-out infinite alternate}
@keyframes liquid{0%{background-position:0% 0%}100%{background-position:100% 100%}}
#fx{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
/* verre noir laqué */
.card{position:relative;background:linear-gradient(180deg,var(--shine),rgba(255,255,255,0) 28%),rgba(5,5,5,.86);border:1px solid var(--edge);border-radius:var(--r2);padding:var(--s3);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-width:0;transition:transform .25s,border-color .25s}
.card::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent)}
.kc:hover,.kc:focus-within{transform:translateY(-4px);border-color:rgba(224,174,40,.45)}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--acc),0 0 36px rgba(224,174,40,.5)}100%{box-shadow:var(--shadow)}}
/* mise en page */
#app{display:flex;min-height:100vh}
aside{position:fixed;z-index:20;top:0;bottom:0;left:0;width:var(--rail);overflow:hidden auto;background:rgba(3,3,3,.92);border-right:1px solid var(--edge);backdrop-filter:blur(18px);transition:width .25s;padding:var(--s2) 14px}
aside:hover,aside:focus-within{width:var(--side)}
aside .lbl,aside .full,aside .pill .w{opacity:0;visibility:hidden;transition:opacity .2s}
aside:hover .lbl,aside:focus-within .lbl,aside:hover .full,aside:focus-within .full,aside:hover .pill .w,aside:focus-within .pill .w{opacity:1;visibility:visible}
aside .lbl,aside .pill .w{white-space:nowrap} aside .full{display:none;white-space:normal;overflow-wrap:anywhere} aside:hover .full,aside:focus-within .full{display:block}
aside .mini{display:flex} aside:hover .mini,aside:focus-within .mini{display:none}
.brand{display:flex;align-items:center;gap:var(--s2);height:48px;margin-bottom:var(--s2);color:var(--main);font:400 18px var(--f-title);letter-spacing:.12em}
.nl{display:flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 10px;border-radius:var(--r1);color:var(--txt);text-decoration:none;font-size:15px}
.nl:hover{background:rgba(255,255,255,.06)} .nl[aria-current=page]{background:rgba(224,174,40,.14);color:var(--main)}
.nl svg,.ic{flex:none;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.fam{display:flex;align-items:center}
.fam .nl{flex:1;min-width:0} .fam .nl span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp{flex:none;width:36px;height:36px;background:none;border:0;color:var(--acc);cursor:pointer;border-radius:8px;font-size:14px}
.exp[aria-expanded=true]{transform:rotate(90deg)}
.sub{list-style:none;margin:0 0 var(--s1) 36px} .sub[hidden]{display:none}
.sub .nl{min-height:40px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12px;line-height:1;padding:5px 9px;border-radius:var(--r3);border:1px solid currentColor;white-space:nowrap}
.pill.vert{color:var(--ok)} .pill.orange{color:var(--warn)} .pill.rouge{color:var(--bad)} .pill.none{color:var(--none)}
.nl .pill{margin-left:auto}
main{flex:1;min-width:0;margin-left:var(--rail);padding:var(--s5) var(--s5) var(--s6);max-width:1500px}
.crumb{font-size:var(--t-cap);margin-bottom:var(--s2);display:flex;flex-wrap:wrap;gap:var(--s1)} .crumb a{text-decoration:none}
.page{display:grid;gap:var(--s4)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.stat .num{font-size:clamp(32px,4vw,48px);line-height:1.1;display:block;margin-top:var(--s1)}
.kc .big{font:400 var(--t-big)/1.05 var(--f-title);color:var(--main);margin:var(--s2) 0 var(--s1);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kc .big .u{font-size:var(--t-sub);margin-left:var(--s1)}
.kc .sub2{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}
.kc .hd{display:flex;justify-content:space-between;gap:var(--s1);align-items:flex-start}
.kc .hd a{text-decoration:none;color:var(--main)}
.info{flex:none;background:none;border:1px solid var(--edge);color:var(--acc);width:28px;height:28px;border-radius:50%;cursor:help;font:400 14px var(--f-title)}
svg.spark{display:block;width:100%;height:40px;margin-top:var(--s2)}
.chart{width:100%;height:380px} .chart.s{height:260px} .chart.t{height:300px}
.msg{font-size:var(--t-sub);font-weight:300;color:var(--main);line-height:1.4;max-width:60ch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:top}
th{font:400 14px var(--f-title);color:var(--acc)} td.n,th.n{text-align:right;white-space:nowrap}
td.n{font-family:var(--f-title);font-variant-numeric:tabular-nums;color:var(--main)}
tr.tot td{font-weight:700;background:rgba(224,174,40,.07)} tr.sec td{color:var(--acc);font-family:var(--f-title);padding-top:var(--s2)}
.btn{display:inline-flex;align-items:center;gap:var(--s1);min-height:44px;padding:0 var(--s3);border-radius:var(--r3);border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--main);font:400 15px var(--f-body);cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.btn.p{background:linear-gradient(180deg,#F1C657,var(--acc));color:#000;border-color:var(--acc);font-weight:400}
.btn.sm{min-height:36px;padding:0 var(--s2);font-size:13px}
.sk{border-radius:var(--r2);height:180px;background:linear-gradient(90deg,#0b0b0b 0%,#1a1a1a 50%,#0b0b0b 100%);background-size:200% 100%;animation:sk 1.6s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.drop{border:1px dashed rgba(224,174,40,.5);border-radius:var(--r2);padding:var(--s5);text-align:center;display:grid;gap:var(--s2);justify-items:center}
.drop.on{background:rgba(224,174,40,.08)}
/* panneau de synchronisation */
.sync{margin-top:var(--s2);padding:12px;border:1px solid var(--edge);border-radius:var(--r1);background:rgba(255,255,255,.03);display:grid;gap:var(--s1);font-size:13px}
.sw{position:relative;width:44px;height:24px;border-radius:var(--r3);border:0;background:#4a4a4a;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--acc)} .sw[aria-checked=true]::after{transform:translateX(20px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s1)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--none)}
.st-ok .dot{background:var(--ok);animation:pulse 2s infinite} .st-read .dot{background:#4DA3FF} .st-recon .dot{background:var(--warn)} .st-err .dot{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(76,195,138,.0);opacity:.5}}
.sync .btn{width:100%;justify-content:center;white-space:normal;text-align:center}
.sync .det{display:grid;gap:4px;opacity:.9} .sync [hidden]{display:none}
#mband,#tabs{display:none}
#vol{display:none}
#toasts{position:fixed;z-index:60;right:var(--s2);bottom:var(--s2);display:grid;gap:var(--s1);max-width:min(420px,calc(100vw - 32px))}
.toast{background:rgba(10,10,10,.96);border:1px solid var(--edge);border-left:3px solid var(--acc);border-radius:var(--r1);padding:12px 16px;color:var(--main);box-shadow:var(--shadow);font-size:14px}
.toast.err{border-left-color:var(--bad)}
.reco{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);align-items:start}
.reco .num{font-size:var(--t-sub)}
@media (max-width:1100px){main{padding:var(--s4) var(--s3) var(--s6)}}
@media (max-width:760px){
  :root{--t-title:40px}
  aside{display:none}
  main{margin-left:0;padding:132px var(--s2) 96px}
  #bg{animation:none}
  #mband{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) var(--s2) 8px;background:rgba(3,3,3,.94);border-bottom:1px solid var(--edge);backdrop-filter:blur(14px)}
  #mband .sync{margin:0;border:0;padding:0;background:none;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1)}
  #mband .full,#mband .mini{display:contents} #mband .det{display:none} #mband .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mband .sync .btn{width:auto}
  #tabs{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(3,3,3,.96);border-top:1px solid var(--edge);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
  #tabs button{flex:1;min-height:52px;background:none;border:0;color:var(--txt);font:300 12px var(--f-body);display:grid;justify-items:center;gap:2px;cursor:pointer}
  #tabs button[aria-current=page]{color:var(--main)}
  #vol.open{display:block;position:fixed;z-index:40;left:0;right:0;bottom:0;top:96px;overflow:auto;background:rgba(3,3,3,.98);border-top:1px solid var(--edge);border-radius:var(--r2) var(--r2) 0 0;padding:var(--s2) var(--s2) 96px}
  #vol .lbl{opacity:1;visibility:visible}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .card{padding:var(--s2)} .chart{height:320px}
  th,td{padding:8px 4px;font-size:14px}
}
@media (min-width:761px) and (max-width:1100px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#fx{display:none}}
</style>

<body>

<div id="app">
  <aside id="side" aria-label="Menu principal"></aside>

  <main id="main" tabindex="-1" aria-live="polite"></main>
</div>

<div id="vol" role="dialog" aria-label="Familles et KPI"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js" crossorigin="anonymous"></script>
<script data-app>
'use strict';
/* =====================================================================
   1. CONFIGURATION · contrat de format et paramètres de l'application
   ===================================================================== */
const FORMAT_ATTENDU = {
  onglets: { message: 'LISEZ-MOI', tft: 'TFT', kpi: 'KPI', controles: 'CONTROLES' },
  // noms définis obligatoires → onglet attendu
  noms: (() => {
    const n = { STATUT_GLOBAL: 'CONTROLES', PARAM_PLAFOND: 'KPI' };
    ['OT', 'IT', 'FT', 'V', 'T0', 'T1'].forEach(c => ['2027', '2026'].forEach(a => { n['TFT_' + c + '_' + a] = 'TFT'; }));
    ['CONV', 'FCF', 'CCC', 'LEV', 'DSCR', 'DIV'].forEach(c => ['2027', '2026'].forEach(a => { n['KPI_' + c + '_' + a] = 'KPI'; }));
    return n;
  })(),
  codesTFT: ['O1', 'O2', 'O3', 'O4', 'O5', 'O6', 'O7', 'O8', 'O9', 'O10', 'O11', 'O12', 'OS', 'O13', 'OT', 'I1', 'I2', 'I3', 'IT', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'FT', 'V', 'T0', 'T1'],
  codesKPI: ['K01', 'K02', 'K03', 'K04', 'K05', 'K06', 'K07', 'K08', 'K09', 'K10', 'K11', 'K12', 'K13', 'K14'],

const LIMITES = { octets: 10 * 1024 * 1024, lignes: 50000, extensions: ['xlsx', 'xlsm', 'xls', 'csv'] };

  { id: 'qualite', nom: 'Qualité du cash', kpis: ['K01', 'K02'], ic: 'drop' },
  { id: 'cash', nom: 'Cash libre et investissements', kpis: ['K03', 'K04', 'K05'], ic: 'coin' },
  { id: 'bfr', nom: 'BFR et cycle de cash', kpis: ['K06', 'K07', 'K08', 'K09'], ic: 'cycle' },
  { id: 'dette', nom: 'Dette et solvabilité', kpis: ['K10', 'K11', 'K12', 'K13'], ic: 'scale' },

const CARTES_TFT = ['K01', 'K03', 'K09', 'K11', 'K13', 'K14'];

const OR = '#E0AE28', GRENAT = '#A3263B', BLANC = '#FFFFFF';
const ICONES = {
  tft: 'M4 20V10M10 20V4M16 20v-8M22 20H2', grille: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
  drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z', coin: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 12h6M12 9v6',
  cycle: 'M20 12a8 8 0 0 1-14 5M4 12a8 8 0 0 1 14-5M18 3v4h-4M6 21v-4h4', scale: 'M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z',
  users: 'M16 20v-2a4 4 0 0 0-8 0v2M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM22 20v-2a3 3 0 0 0-3-3M17 6a3 3 0 0 1 0 6',
  upload: 'M12 16V4M7 9l5-5 5 5M4 20h16', down: 'M12 4v12M7 11l5 5 5-5M4 20h16', menu: 'M4 6h16M4 12h16M4 18h16'
};

/* =====================================================================
   2. SÉCURITÉ · aucun texte du fichier n'est exécuté (createElement + textContent)
   ===================================================================== */
const EN_CADRE = (window.top !== window.self);          // page ouverte dans un autre site : on masque tout
if (EN_CADRE) document.documentElement.style.display = 'none';
class ErrUtil extends Error {}                           // message affichable, sans détail technique
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function h(tag, attrs, ...kids) {

    const v = attrs[k]; if (v == null || v === false) continue;

const icone = nom => sv('svg', { viewBox: '0 0 24 24', class: 'ic', 'aria-hidden': 'true' }, sv('path', { d: ICONES[nom] }));
function vider(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function garde(octets, nom) {                           // refuse tout fichier hors contrat
  const ext = String(nom).split('.').pop().toLowerCase();
  if (!LIMITES.extensions.includes(ext)) throw new ErrUtil('Format refusé : utilisez un fichier .xlsx, .xls ou .csv.');
  if (octets.byteLength > LIMITES.octets) throw new ErrUtil('Fichier trop volumineux : 10 Mo maximum.');
  const b = new Uint8Array(octets.slice(0, 8));

  if ((ext === 'xlsx' || ext === 'xlsm') && !zip) throw new ErrUtil('Ce fichier n’est pas un vrai classeur Excel.');
  if (ext === 'xls' && !ole && !zip) throw new ErrUtil('Ce fichier n’est pas un vrai classeur Excel.');

function protegeExport(v) { return (typeof v === 'string' && /^[=+\-−@\t\r\n]/.test(v)) ? "'" + v : v; }   // formules piégées neutralisées

/* =====================================================================
   3. LECTURE DES DONNÉES · tout passe par FORMAT_ATTENDU
   ===================================================================== */
let COMPTE_ERREURS = 0, FORMULE_SANS_VALEUR = false;
function valeurCellule(c) {
  if (!c) return null;
  if (c.t === 'e') { COMPTE_ERREURS++; return null; }       // #N/A, #DIV/0! : traités comme vides
  if (c.v === undefined || c.v === null) { if (c.f) FORMULE_SANS_VALEUR = true; return null; }
  return c.v;
}
function nombre(v) {                                       // « 1 234,56 », « 1,234.56 », « (1 234) », « 12 % »
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v !== 'string') return null;
  let s = v.replace(/[\s\u00a0\u202f]/g, '').replace(/−/g, '-'), neg = false, pct = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('%')) { pct = true; s = s.slice(0, -1); }
  if (!/^[-+]?[\d.,]+$/.test(s)) return null;
  const vir = s.lastIndexOf(','), pt = s.lastIndexOf('.');
  if (vir >= 0 && pt >= 0) s = vir > pt ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (vir >= 0) s = s.replace(',', '.');
  let n = parseFloat(s); if (!isFinite(n)) return null;
  if (neg) n = -n; if (pct) n /= 100; return n;
}

  if ((!S.enabled && !force) || S.occupe) return; S.occupe = true;
  try { if (S.mode === 'direct') await verifierDirect(force); else if (S.mode === 'online') await lireEnLigne(force); } catch (e) { /* géré dans les fonctions */ } finally { S.occupe = false; }
}
async function verifierDirect(force) {
  let f; try { f = await S.handle.getFile(); } catch (e) { setStatut('recon', 'Le fichier est introuvable, déplacé ou l’autorisation a été retirée.'); return; }
  S.verif = Date.now();
  if (!force && S.sig && f.lastModified === S.sig.m && f.size === S.sig.s) { if (S.statut !== 'ok' && S.statut !== 'err') setStatut('ok'); majSync(); return; }
  setStatut('read'); await dormir(700);                                   // Excel est en train d'enregistrer : on attend la stabilité
  let f2; try { f2 = await S.handle.getFile(); } catch (e) { setStatut('recon', 'Le fichier est devenu inaccessible.'); return; }
  if (f2.lastModified !== f.lastModified || f2.size !== f.size) { S.sig = null; return; }
  let buf = null; for (let i = 0; i < 3 && !buf; i++) { try { buf = await f2.arrayBuffer(); } catch (e) { await dormir(330); } }
  if (!buf) { echec('Le fichier est en cours d’enregistrement ou verrouillé.'); return; }
  S.sig = { m: f2.lastModified, s: f2.size }; S.nom = f2.name; await traiter(buf, f2.name);
}
async function lireEnLigne(force) {
  try { const r = await fetch('donnees.xlsx', { cache: 'no-cache' }); if (!r.ok) throw new Error('absent'); const buf = await r.arrayBuffer(); S.verif = Date.now(); S.nom = 'donnees.xlsx'; await traiter(buf, 'donnees.xlsx'); return true; }
  catch (e) { if (S.data) echec('donnees.xlsx est introuvable pour le moment.'); return false; }
}
function echec(raison) {
  S.verif = Date.now();
  if (S.data) { setStatut('err', raison); toast(raison, true); } else { setStatut('err', raison); rendre(); }
}
async function traiter(buf, nom, importe) {
  try {
    garde(buf, nom);
    const wb = XLSX.read(buf, { type: 'array', cellFormula: true, cellDates: true, cellHTML: false, bookVBA: false, codepage: 1252 });
    const nouveau = extraire(wb);
    if (nouveau.formuleVide) throw new ErrUtil('Ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules.');
    const plat = aplatir(nouveau), h2 = await empreinte(JSON.stringify(Array.from(plat.entries())));
    S.verif = Date.now();
    if (S.data && h2 === S.hash) { setStatut(importe ? 'import' : 'ok'); return; }
    const avant = S.data ? aplatir(S.data) : null, modifs = [];
    if (avant) plat.forEach((v, k) => { if (JSON.stringify(avant.get(k)) !== JSON.stringify(v)) modifs.push(k); });
    S.data = nouveau; S.hash = h2; S.derniere = new Date(); S.ecarts = controleCroise(nouveau);
    setStatut(importe ? 'import' : 'ok');
    const kp = new Set(modifs.filter(k => k.startsWith('k.')).map(k => k.split('.')[1]));
    rendre({ flash: Array.from(kp) });
    if (avant) toast('Données mises à jour à ' + heure(S.derniere) + ' : ' + modifs.length + ' valeur' + (modifs.length > 1 ? 's' : '') + ' modifiée' + (modifs.length > 1 ? 's' : ''));
    else toast('Fichier chargé : ' + nom);
    if (S.ecarts.some(e => !e.ok)) toast('Écart entre le fichier et le recalcul : le fichier fait foi.', true);
  } catch (e) { echec(e instanceof ErrUtil ? e.message : 'Le fichier n’a pas pu être lu.'); }
}
async function enregistrerPoignee(hd) { try { await idb('set', 'handle', hd); } catch (e) { /* facultatif */ } }
async function connecter() {
  if (!PEUT_DIRECT) { document.getElementById('imp').click(); return; }
  try {
    const [hd] = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'Classeur Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'], 'application/vnd.ms-excel': ['.xls'], 'text/csv': ['.csv'] } }] });
    await brancher(hd);
  } catch (e) { /* annulé par l'utilisateur */ }
}
async function brancher(hd) { S.handle = hd; S.mode = 'direct'; S.nom = hd.name; S.sig = null; await enregistrerPoignee(hd); relancer(); await tick(true); }
async function reconnecter() {
  try { const p = await S.handle.requestPermission({ mode: 'read' }); if (p === 'granted') { S.mode = 'direct'; S.sig = null; relancer(); await tick(true); } else setStatut('recon', 'Autorisation refusée.'); } catch (e) { setStatut('recon', 'Reconnexion impossible : choisissez à nouveau le fichier.'); }
}
async function importer(f) {
  if (!f) return; S.mode = 'import'; S.nom = f.name; S.handle = null; relancer();
  try { await traiter(await f.arrayBuffer(), f.name, true); } catch (e) { echec('Le fichier n’a pas pu être lu.'); }
}
async function effacer() { try { await idb('del', 'handle'); localStorage.removeItem('atlas_sync'); } catch (e) { /* ignoré */ } S.handle = null; S.sig = null; S.nom = S.data ? S.nom : ''; toast('Mémoire du fichier connecté effacée.'); majSync(); }
function brancherDepot() {
  document.addEventListener('dragover', e => { e.preventDefault(); });
  document.addEventListener('drop', async e => {
    e.preventDefault(); const it = e.dataTransfer && e.dataTransfer.items && e.dataTransfer.items[0]; if (!it) return;
    try { if (it.getAsFileSystemHandle) { const hd = await it.getAsFileSystemHandle(); if (hd && hd.kind === 'file') { await brancher(hd); return; } } } catch (er) { /* repli sur l'import */ }
    importer(e.dataTransfer.files[0]);
  });
  document.getElementById('imp').addEventListener('change', e => { importer(e.target.files[0]); e.target.value = ''; });
}
async function demarrer() {
  S.statut = 'init'; rendre();
  try { const hd = await idb('get', 'handle'); if (hd && PEUT_DIRECT) { S.handle = hd; S.nom = hd.name; S.mode = 'direct'; const p = await hd.queryPermission({ mode: 'read' }); if (p === 'granted') { relancer(); await tick(true); return; } setStatut('recon', 'Autorisez de nouveau l’accès au fichier.'); rendre(); return; } } catch (e) { /* pas de poignée */ }
  if (HTTP) { S.mode = 'online'; if (await lireEnLigne(true)) { relancer(); return; } }
  S.mode = PEUT_DIRECT ? null : 'import'; setStatut('none'); rendre();
}
function fond() {                                                          // particules reliées, très lentes, sans couleur
  const cv = document.getElementById('fx'), cx = cv.getContext('2d'); if (!cx) return;
  const petit = window.matchMedia('(max-width:760px)').matches; let W, H; const N = petit ? 0 : 46, P = [];
  const taille = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; }; taille(); addEventListener('resize', taille);
  for (let i = 0; i < N; i++) P.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18 });
  const pas = () => { cx.clearRect(0, 0, W, H); P.forEach(p => { p.x = (p.x + p.vx + W) % W; p.y = (p.y + p.vy + H) % H; cx.fillStyle = 'rgba(255,255,255,.18)'; cx.beginPath(); cx.arc(p.x, p.y, 1.4, 0, 6.3); cx.fill(); });
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, dd = dx * dx + dy * dy; if (dd < 22000) { cx.strokeStyle = 'rgba(255,255,255,' + (.09 * (1 - dd / 22000)).toFixed(3) + ')'; cx.beginPath(); cx.moveTo(P[i].x, P[i].y); cx.lineTo(P[j].x, P[j].y); cx.stroke(); } }
    if (!prefereMoins()) requestAnimationFrame(pas); };
  if (N && !prefereMoins()) requestAnimationFrame(pas);
}
function init() {
  try { S.enabled = localStorage.getItem('atlas_sync') !== '0'; } catch (e) { S.enabled = true; }
  const side = document.getElementById('side');
  side.append(h('div', { class: 'brand' }, icone('coin'), h('span', { class: 'lbl' }, 'ATLAS')), h('div', { id: 'side-menu' }), creerSync('menu'));
  document.getElementById('mband').append(creerSync('bande'));
  document.getElementById('vol').append(h('div', { id: 'vol-menu' }));
  document.getElementById('vol').addEventListener('click', e => { if (e.target.closest('a')) fermerVolet(); });
  S.route = lireRoute(); brancherDepot(); fond();
  addEventListener('hashchange', () => { S.route = lireRoute(); S.anime = true; if (S.data) { rendre(); window.scrollTo(0, 0); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.enabled) tick(false); });
  setInterval(() => { if (S.statut === 'ok') majSync(); }, 1000);
  addEventListener('resize', () => S.charts.forEach(c => { try { c.resize(); } catch (e) { /* ignoré */ } }));
  demarrer();
}
if (!EN_CADRE) init();
